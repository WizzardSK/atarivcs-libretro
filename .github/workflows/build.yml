name: Build

on:
  push:
  workflow_dispatch:

# The core carries the x86-64 shim it preloads into the games
# (src/shim_blob.S); the aarch64 build makes it with an x86-64 cross
# compiler, as the libretro buildbot's job does (.gitlab-ci.yml).
jobs:
  core:
    name: Core (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.arch == 'aarch64'
        run: sudo apt-get update -qq && sudo apt-get install -yqq --no-install-recommends gcc-x86-64-linux-gnu libc6-dev-amd64-cross
      # aarch64: FEX and its x86-64 libraries carried in the core, which
      # writes them to system/atarivcs (stamped, so a new build rewrites them)
      - if: matrix.arch == 'aarch64'
        run: |
          python3 scripts/fetch-fex.py fexzip
          git rev-parse --short HEAD > fexzip/fex/build
          (cd fexzip && zip -q -r -y -9 "$GITHUB_WORKSPACE/fex.zip" .)
          ls -la fex.zip
      - if: matrix.arch == 'aarch64'
        run: make FEX_ZIP=fex.zip
      - if: matrix.arch != 'aarch64'
        run: make
      - run: file atarivcs_libretro.so atarivcs_shim_x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: atarivcs_libretro-linux-${{ matrix.arch }}
          path: |
            atarivcs_libretro.so
            atarivcs_shim_x86_64.so
            atarivcs_libretro.info
