name: Build

on:
  push:
  workflow_dispatch:

# The core carries the x86-64 shim it preloads into the games
# (src/shim_blob.S); the aarch64 build makes it with an x86-64 cross
# compiler, as the libretro buildbot's job does (.gitlab-ci.yml).
jobs:
  core:
    name: Core (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.arch == 'aarch64'
        run: sudo apt-get update -qq && sudo apt-get install -yqq --no-install-recommends gcc-x86-64-linux-gnu libc6-dev-amd64-cross
      - run: make
      - run: file atarivcs_libretro.so atarivcs_shim_x86_64.so
      - uses: actions/upload-artifact@v4
        with:
          name: atarivcs_libretro-linux-${{ matrix.arch }}
          path: |
            atarivcs_libretro.so
            atarivcs_shim_x86_64.so
            atarivcs_libretro.info
      # FEX and its x86-64 libraries for RetroArch's system folder, as a
      # tarball: an artifact's zip would drop the symlinks and exec bits
      - if: matrix.arch == 'aarch64'
        run: |
          python3 scripts/fetch-fex.py system/atarivcs
          tar -czf atarivcs-system-aarch64.tar.gz system
          du -sh system/atarivcs/* atarivcs-system-aarch64.tar.gz
      - if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: atarivcs-system-linux-aarch64
          path: atarivcs-system-aarch64.tar.gz
